<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0f19"><meta name="description" content="Manage the CineMind film catalog locally in this browser."><title>CineMind | Studio</title><link rel="icon" href="assets/mark.svg" type="image/svg+xml"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/styles.css"><script defer src="js/app.js"></script></head><body><div class="reading-progress"></div><header data-site-header></header><main id="main" class="container page-main"><div class="page-heading"><p class="eyebrow">CINEMIND STUDIO / LOCAL</p><h1>Shape the<br><em>film archive.</em></h1><p>Changes are saved in this browser and won't update the source JSON file.</p></div><div class="admin-layout"><form id="movie-form" class="admin-form panel"><h2 id="form-title">Add a film</h2><input type="hidden" id="movie-id"><label for="movie-title">Title</label><input id="movie-title" required><label for="movie-genre">Genre <span>Separate with commas</span></label><input id="movie-genre" required placeholder="Sci-Fi, Drama"><div class="form-row"><div><label for="movie-rating">Rating</label><input id="movie-rating" type="number" min="0" max="10" step="0.1" required></div><div><label for="movie-year">Year</label><input id="movie-year" type="number" min="1888" max="2100" required></div></div><label for="movie-director">Director</label><input id="movie-director" required><label for="movie-poster">Poster image URL</label><input id="movie-poster" type="url" required><label for="movie-summary">Summary</label><textarea id="movie-summary" rows="3" required></textarea><label for="movie-character">Character focus</label><input id="movie-character" required><label for="movie-lesson">Life lesson</label><textarea id="movie-lesson" rows="2" required></textarea><label for="movie-story">Story analysis</label><textarea id="movie-story" rows="4"></textarea><label for="movie-development">Character development</label><textarea id="movie-development" rows="3" required></textarea><label for="movie-strategy">Strategy breakdown</label><textarea id="movie-strategy" rows="3" required></textarea><label for="movie-psychology">Psychology angle</label><textarea id="movie-psychology" rows="3" required></textarea><label for="movie-quote">Favorite quote</label><textarea id="movie-quote" rows="2" required></textarea><label for="movie-related">Related movie IDs <span>Separate with commas</span></label><input id="movie-related" placeholder="arrival, interstellar"><div class="form-actions"><button class="button button-primary" type="submit">Save film</button><button class="button button-quiet" id="cancel-edit" type="button" hidden>Cancel edit</button></div></form><section class="admin-list"><div class="admin-list-heading"><h2>Archive</h2><span id="admin-count" class="eyebrow"></span></div><div id="admin-movies"></div></section></div></main><footer data-site-footer></footer></body></html>
